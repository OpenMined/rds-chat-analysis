[project]
name = "rds-chat-analysis"
version = "0.1.0"
description = "privacy preserving LLM chat analysis for syft-rds"
readme = "README.md"
authors = [{ name = "Eelco van der Wel", email = "eelco@openmined.org" }]
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.6.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "langchain>=0.3.25",
    "langchain-openai>=0.3.19",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
    "syft-rds>=0.1.2",
]


[dependency-groups]
dev = ["pre-commit>=4.2.0", "pytest>=8.4.0"]

[tool.uv.sources]
syft-rds = { git = "https://github.com/OpenMined/rds.git", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
